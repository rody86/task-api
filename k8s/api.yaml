apiVersion: apps/v1
kind: Deployment
metadata:
  name: task-api
spec:
  replicas: 1
  selector:
    matchLabels:
      app: task-api
  template:
    metadata:
      labels:
        app: task-api
    spec:
      containers:
        - name: task-api
          image: ghcr.io/rody86/task-api:main
          imagePullPolicy: Always
          env:
            - name: DATABASE_URL
              value: "postgresql://taskuser:taskpass@db:5432/taskdb"
          ports:
            - containerPort: 8000
---
apiVersion: v1
kind: Service
metadata:
  name: task-api
spec:
  type: NodePort
  selector:
    app: task-api
  ports:
    - port: 8080
      targetPort: 8000
      nodePort: 30080
