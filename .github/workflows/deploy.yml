name: Build and Deploy to K8s

on:
  push:
    branches: [ "main" ]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=sha,format=short

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  deploy:
    needs: build-and-push # Solo despliega si el build ha ido bien
    runs-on: ubuntu-latest

    steps:
      - name: Deploy to EC2 via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            # 1. Exportar el KUBECONFIG
            export KUBECONFIG=/home/ec2-user/.kube/config

            # 2. Descargar TODOS los manifiestos desde GitHub de una vez
            REPO_URL="https://api.github.com/repos/rody86/task-api/contents/k8s"
            FILES="api.yaml db.yaml ingress.yaml grafana.yaml prometheus.yaml postgres-sealed-secret.yaml argocd-repo-creds-sealed.yaml"

            for file in $FILES; do
              curl -s -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
                   -H "Accept: application/vnd.github.v3.raw" \
                   -o $file \
                   $REPO_URL/$file
            done

            # 3. Aplicar los secretos primero (para que los Pods puedan arrancar)
            kubectl apply -f postgres-sealed-secret.yaml
            kubectl apply -f argocd-repo-creds-sealed.yaml

            # Esperar activamente a que el secreto de Postgres exista
            echo "Esperando a que el secreto postgres-secret esté listo..."
            for i in {1..10}; do
              if kubectl get secret postgres-secret &> /dev/null; then
                echo "Secreto listo."
                break
              fi
              sleep 2
            done

            # 4. Aplicar el resto de manifiestos
            kubectl apply -f db.yaml
            kubectl apply -f api.yaml
            kubectl apply -f ingress.yaml
            kubectl apply -f grafana.yaml
            kubectl apply -f prometheus.yaml

            # 5. Forzar la actualización de la API (Rolling Update) sin esperar (evita timeout)
            kubectl rollout restart deployment/task-api
            
            echo "Despliegue aplicado correctamente en el clúster."
